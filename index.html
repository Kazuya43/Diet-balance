<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DietBalance">
<meta name="theme-color" content="#4A90D9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kazuya式ダイエット逆算</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f7fa;
    color: #2c3e50;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(80px, env(safe-area-inset-bottom));
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
  }
  h1 { font-size: 20px; margin-bottom: 16px; }
  .nav-bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #e1e8ed;
    display: flex;
    max-width: 500px;
    margin: 0 auto;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    z-index: 100;
  }
  .nav-bottom a {
    flex: 1;
    text-align: center;
    padding: 8px;
    color: #999;
    text-decoration: none;
    font-size: 12px;
  }
  .nav-bottom a.active { color: #4A90D9; font-weight: 600; }
  .nav-bottom a .icon { display: block; font-size: 20px; margin-bottom: 2px; }
  .card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .card h2 { font-size: 16px; margin-bottom: 12px; color: #4A90D9; }
  input, button, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #e1e8ed;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 8px;
    font-family: inherit;
  }
  button {
    background: #4A90D9;
    color: white;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button:disabled { background: #aaa; cursor: not-allowed; }
  .meal-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .result {
    background: linear-gradient(135deg, #4A90D9, #357ab8);
    color: white;
    padding: 24px;
    border-radius: 16px;
    text-align: center;
    margin-bottom: 16px;
  }
  .result .big { font-size: 36px; font-weight: 700; margin: 8px 0; }
  .result .label { font-size: 14px; opacity: 0.9; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 12px;
    font-size: 13px;
  }
  .stat {
    background: rgba(255,255,255,0.15);
    padding: 8px;
    border-radius: 8px;
  }
  .stat .v { font-weight: 600; font-size: 16px; }
  .warning { background: linear-gradient(135deg, #ff9800, #f57c00); }
  .success { background: linear-gradient(135deg, #4caf50, #388e3c); }
  .upload-area {
    border: 2px dashed #4A90D9;
    border-radius: 12px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    background: #f0f7ff;
  }
  .upload-area input { display: none; }
  .upload-icon { font-size: 36px; margin-bottom: 8px; }
  .upload-text { color: #4A90D9; font-weight: 600; }
  .upload-sub { font-size: 12px; color: #777; margin-top: 4px; }
  #preview {
    max-width: 100%;
    border-radius: 8px;
    margin-top: 12px;
    display: none;
  }
  .status {
    padding: 12px;
    border-radius: 8px;
    margin-top: 8px;
    font-size: 14px;
    display: none;
  }
  .status.loading { background: #fff3cd; color: #856404; display: block; }
  .status.success { background: #d4edda; color: #155724; display: block; }
  .status.error { background: #f8d7da; color: #721c24; display: block; }
  .config { font-size: 13px; color: #777; }
  .config-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .delete-btn {
    background: none;
    color: #e74c3c;
    border: none;
    width: auto;
    padding: 0 8px;
    font-size: 18px;
    cursor: pointer;
    margin: 0;
  }
  details summary {
    cursor: pointer;
    font-weight: 600;
    color: #4A90D9;
    padding: 8px 0;
  }
  .api-warn { font-size: 12px; color: #d32f2f; margin-top: 4px; }
  .body-data {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .body-data .stat {
    background: #f0f7ff;
    color: #2c3e50;
    text-align: center;
    padding: 12px 4px;
    border-radius: 8px;
  }
  .body-data .stat .v { font-size: 18px; font-weight: 700; color: #4A90D9; }
  .body-data .stat .l { font-size: 11px; color: #777; }
  .install-banner {
    background: #fff3cd;
    color: #856404;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>
<h1>🎯 Kazuya式ダイエット逆算</h1>

<div class="install-banner" id="installBanner">
  📱 ホーム画面に追加するには：<br>
  Safari共有ボタン → 「ホーム画面に追加」
</div>

<div class="result" id="result">
  <div class="label">あと何歩で今日の食事を相殺？</div>
  <div class="big" id="stepsNeeded">--</div>
  <div class="label">歩</div>
  <div class="stats">
    <div class="stat"><div>摂取</div><div class="v" id="totalIntake">0 kcal</div></div>
    <div class="stat"><div>現在歩数</div><div class="v" id="currentSteps">0 歩</div></div>
    <div class="stat"><div>消費合計</div><div class="v" id="totalBurn">0 kcal</div></div>
    <div class="stat"><div>収支</div><div class="v" id="balance">0 kcal</div></div>
  </div>
</div>

<div class="card">
  <h2>📸 スクショ判定（自動入力）</h2>
  <label class="upload-area" for="imageInput">
    <div class="upload-icon">📷</div>
    <div class="upload-text">タップして画像を選択</div>
    <div class="upload-sub">体重計 / 歩数アプリ / 食事写真</div>
    <input type="file" id="imageInput" accept="image/*" onchange="handleImage(event)">
  </label>
  <img id="preview">
  <div class="status" id="status"></div>
</div>

<div class="card">
  <h2>⚖️ 今日の体組成</h2>
  <div class="body-data">
    <div class="stat"><div class="v" id="bodyWeight">--</div><div class="l">体重 (kg)</div></div>
    <div class="stat"><div class="v" id="bodyFat">--</div><div class="l">体脂肪率 (%)</div></div>
    <div class="stat"><div class="v" id="muscle">--</div><div class="l">筋肉量 (kg)</div></div>
  </div>
</div>

<div class="card">
  <h2>🍽 今日食べたもの</h2>
  <div id="meals"></div>
  <details>
    <summary>+ 手動で追加</summary>
    <div style="display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px; margin-top: 8px;">
      <input id="mealName" placeholder="食事名">
      <input id="mealKcal" type="number" placeholder="kcal">
      <button onclick="addMealManual()" style="padding: 12px 16px;">追加</button>
    </div>
  </details>
</div>

<div class="card">
  <details>
    <summary>⚙️ 設定</summary>
    <div style="margin-top: 12px;">
      <div class="config">Gemini API キー</div>
      <input id="apiKey" type="password" placeholder="AIza...">
      <div class="api-warn">⚠️ ブラウザ内のlocalStorageに保存されます</div>

      <div class="config-row" style="margin-top: 12px;">
        <div>
          <div class="config">基礎代謝</div>
          <input id="bmr" type="number" value="1702" oninput="calculate()">
        </div>
        <div>
          <div class="config">目標赤字</div>
          <input id="deficit" type="number" value="500" oninput="calculate()">
        </div>
        <div>
          <div class="config">歩あたり消費</div>
          <input id="kcalPerStep" type="number" value="0.04" step="0.01" oninput="calculate()">
        </div>
        <div>
          <div class="config">手動歩数</div>
          <input id="steps" type="number" placeholder="スクショ優先" oninput="calculate()">
        </div>
      </div>
      <button onclick="resetDay()" style="background: #e74c3c; margin-top: 12px;">今日のデータをリセット</button>
    </div>
  </details>
</div>

<div class="nav-bottom">
  <a href="index.html" class="active"><span class="icon">🎯</span>逆算</a>
  <a href="roadmap.html"><span class="icon">🗺</span>ロードマップ</a>
</div>

<script>
// Service Worker登録
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => console.log('SW登録失敗', err));
  });
}

// iOSでスタンドアロン未起動時のインストールガイド表示
if (!window.matchMedia('(display-mode: standalone)').matches && /iPhone|iPad/.test(navigator.userAgent)) {
  setTimeout(() => {
    document.getElementById('installBanner').style.display = 'block';
  }, 3000);
}

let state = JSON.parse(localStorage.getItem('dietState') || '{}');
state.meals = state.meals || [];
state.steps = state.steps || 0;
state.body = state.body || {};

function save() {
  localStorage.setItem('dietState', JSON.stringify(state));
}

document.getElementById('apiKey').value = localStorage.getItem('geminiKey') || '';
document.getElementById('apiKey').addEventListener('input', e => {
  localStorage.setItem('geminiKey', e.target.value);
});

function showStatus(msg, type) {
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = 'status ' + type;
}

async function handleImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  const apiKey = document.getElementById('apiKey').value;
  if (!apiKey) {
    showStatus('⚠️ 設定からGemini APIキーを入力してください', 'error');
    return;
  }

  const reader = new FileReader();
  reader.onload = async function(e) {
    document.getElementById('preview').src = e.target.result;
    document.getElementById('preview').style.display = 'block';
    showStatus('🤖 Geminiが画像を解析中...', 'loading');

    const base64 = e.target.result.split(',')[1];
    const mimeType = file.type;

    try {
      const result = await analyzeImage(base64, mimeType, apiKey);
      applyResult(result);
    } catch (err) {
      showStatus('❌ エラー: ' + err.message, 'error');
    }
  };
  reader.readAsDataURL(file);
}

async function analyzeImage(base64, mimeType, apiKey) {
  const prompt = `この画像を分析して、以下のJSON形式で返してください。コードブロックや説明文は不要、JSONのみ返してください。

画像の種類を判定し、該当する情報を抽出してください：

1. 体重計アプリの画面の場合:
{"type": "body", "weight": 数値, "bodyFat": 数値, "muscle": 数値}
(取得できない値はnull)

2. 歩数アプリの画面の場合:
{"type": "steps", "steps": 数値}

3. 食事の写真の場合（複数品目があれば全部）:
{"type": "meal", "items": [{"name": "食品名", "kcal": 推定カロリー}]}

4. その他/判定不能:
{"type": "unknown"}`;

  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      contents: [{
        parts: [
          {text: prompt},
          {inline_data: {mime_type: mimeType, data: base64}}
        ]
      }]
    })
  });

  if (!response.ok) {
    const err = await response.text();
    throw new Error(`API error: ${response.status} ${err.substring(0, 100)}`);
  }

  const data = await response.json();
  const text = data.candidates[0].content.parts[0].text;
  const cleaned = text.replace(/```json|```/g, '').trim();
  return JSON.parse(cleaned);
}

function applyResult(result) {
  if (result.type === 'body') {
    state.body = {
      weight: result.weight,
      bodyFat: result.bodyFat,
      muscle: result.muscle
    };
    showStatus(`✅ 体組成を取得: ${result.weight}kg / ${result.bodyFat}% / 筋肉${result.muscle}kg`, 'success');
  } else if (result.type === 'steps') {
    state.steps = result.steps;
    showStatus(`✅ 歩数を取得: ${result.steps.toLocaleString()}歩`, 'success');
  } else if (result.type === 'meal') {
    result.items.forEach(item => state.meals.push(item));
    const total = result.items.reduce((s, i) => s + i.kcal, 0);
    const names = result.items.map(i => i.name).join('、');
    showStatus(`✅ 食事を追加: ${names} (合計${total}kcal)`, 'success');
  } else {
    showStatus('❓ 画像の種類を判定できませんでした', 'error');
  }
  save();
  render();
}

function addMealManual() {
  const name = document.getElementById('mealName').value;
  const kcal = parseFloat(document.getElementById('mealKcal').value);
  if (!name || !kcal) return;
  state.meals.push({ name, kcal });
  document.getElementById('mealName').value = '';
  document.getElementById('mealKcal').value = '';
  save();
  render();
}

function removeMeal(i) {
  state.meals.splice(i, 1);
  save();
  render();
}

function resetDay() {
  if (!confirm('今日のデータを全削除しますか？')) return;
  state = { meals: [], steps: 0, body: {} };
  save();
  render();
}

function render() {
  const list = document.getElementById('meals');
  if (state.meals.length === 0) {
    list.innerHTML = '<div style="color: #999; font-size: 14px; padding: 8px 0;">まだ食事が記録されていません</div>';
  } else {
    list.innerHTML = state.meals.map((m, i) =>
      `<div class="meal-item">
        <span>${m.name}</span>
        <span>${m.kcal} kcal <button class="delete-btn" onclick="removeMeal(${i})">×</button></span>
      </div>`
    ).join('');
  }
  document.getElementById('bodyWeight').textContent = state.body.weight || '--';
  document.getElementById('bodyFat').textContent = state.body.bodyFat || '--';
  document.getElementById('muscle').textContent = state.body.muscle || '--';
  calculate();
}

function calculate() {
  const intake = state.meals.reduce((s, m) => s + m.kcal, 0);
  const manualSteps = parseFloat(document.getElementById('steps').value) || 0;
  const steps = state.steps || manualSteps;
  const bmr = parseFloat(document.getElementById('bmr').value) || 1702;
  const deficit = parseFloat(document.getElementById('deficit').value) || 500;
  const kcalPerStep = parseFloat(document.getElementById('kcalPerStep').value) || 0.04;

  const stepBurn = steps * kcalPerStep;
  const totalBurn = bmr + stepBurn;
  const balance = intake - totalBurn;

  const remainingDeficit = intake - (bmr + stepBurn) + deficit;
  const stepsNeeded = Math.max(0, Math.ceil(remainingDeficit / kcalPerStep));

  document.getElementById('totalIntake').textContent = intake + ' kcal';
  document.getElementById('currentSteps').textContent = steps.toLocaleString() + ' 歩';
  document.getElementById('totalBurn').textContent = Math.round(totalBurn) + ' kcal';
  document.getElementById('balance').textContent = (balance > 0 ? '+' : '') + Math.round(balance) + ' kcal';

  const result = document.getElementById('result');
  if (stepsNeeded === 0) {
    document.getElementById('stepsNeeded').textContent = '達成🎉';
    result.className = 'result success';
  } else {
    document.getElementById('stepsNeeded').textContent = stepsNeeded.toLocaleString();
    result.className = stepsNeeded > 10000 ? 'result warning' : 'result';
  }
}

render();
</script>
</body>
</html>
