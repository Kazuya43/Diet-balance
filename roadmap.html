<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4A90D9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ロードマップ | Kazuya式ダイエット</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f7fa;
    color: #2c3e50;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(80px, env(safe-area-inset-bottom));
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  h1 { font-size: 20px; }
  .back-btn {
    background: white;
    border: 1px solid #e1e8ed;
    color: #4A90D9;
    padding: 8px 16px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  .overall-progress {
    background: linear-gradient(135deg, #4A90D9, #357ab8);
    color: white;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 16px;
  }
  .overall-progress .label { font-size: 13px; opacity: 0.9; }
  .overall-progress .big { font-size: 32px; font-weight: 700; margin: 4px 0; }
  .overall-bar {
    background: rgba(255,255,255,0.2);
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 12px;
  }
  .overall-bar-fill {
    background: white;
    height: 100%;
    transition: width 0.5s;
  }
  .step {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
  }
  .step.completed { background: #f0f9f0; }
  .step.completed::after {
    content: '✓ 達成';
    position: absolute;
    top: 12px;
    right: 12px;
    background: #4caf50;
    color: white;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .step.current { border: 2px solid #4A90D9; }
  .step.current::after {
    content: '進行中';
    position: absolute;
    top: 12px;
    right: 12px;
    background: #4A90D9;
    color: white;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .step.locked { opacity: 0.5; }
  .step h2 {
    font-size: 16px;
    color: #4A90D9;
    margin-bottom: 4px;
  }
  .step .subtitle {
    font-size: 12px;
    color: #999;
    margin-bottom: 12px;
  }
  .goals { margin-bottom: 12px; }
  .goal {
    display: flex;
    align-items: center;
    padding: 8px 0;
    font-size: 14px;
    border-bottom: 1px solid #f0f0f0;
  }
  .goal:last-child { border-bottom: none; }
  .goal .check {
    width: 20px;
    height: 20px;
    border: 2px solid #ddd;
    border-radius: 4px;
    margin-right: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .goal.done .check {
    background: #4caf50;
    border-color: #4caf50;
    color: white;
  }
  .goal.done .check::after { content: '✓'; font-size: 14px; }
  .goal.auto .check {
    background: #e3f2fd;
    border-color: #4A90D9;
    cursor: default;
  }
  .goal.auto.done .check { background: #4caf50; border-color: #4caf50; }
  .goal-text { flex: 1; }
  .goal .auto-tag {
    font-size: 10px;
    background: #e3f2fd;
    color: #4A90D9;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 8px;
  }
  .goal .current-value {
    font-size: 11px;
    color: #999;
    margin-top: 2px;
  }
  .reward {
    background: linear-gradient(135deg, #fff8e1, #ffe0b2);
    padding: 12px;
    border-radius: 12px;
    margin-top: 12px;
    font-size: 13px;
  }
  .reward .reward-label {
    font-size: 11px;
    color: #f57c00;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .reward .reward-name {
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 4px;
  }
  .reward .reward-desc {
    font-size: 12px;
    color: #666;
  }
  .progress-bar {
    background: #f0f0f0;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-bar-fill {
    background: linear-gradient(90deg, #4A90D9, #357ab8);
    height: 100%;
    transition: width 0.5s;
  }
  .nav-bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #e1e8ed;
    display: flex;
    max-width: 500px;
    margin: 0 auto;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
  }
  .nav-bottom a {
    flex: 1;
    text-align: center;
    padding: 8px;
    color: #999;
    text-decoration: none;
    font-size: 12px;
  }
  .nav-bottom a.active { color: #4A90D9; font-weight: 600; }
  .nav-bottom a .icon { display: block; font-size: 20px; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="header">
  <h1>🗺 ジム卒業ロードマップ</h1>
  <a href="index.html" class="back-btn">← 戻る</a>
</div>

<div class="overall-progress">
  <div class="label">全体の進捗</div>
  <div class="big" id="overallPercent">0%</div>
  <div class="label">チョコザップ → エニタイム</div>
  <div class="overall-bar">
    <div class="overall-bar-fill" id="overallBar" style="width: 0%"></div>
  </div>
</div>

<div id="steps"></div>

<div class="nav-bottom">
  <a href="index.html"><span class="icon">🎯</span>逆算</a>
  <a href="roadmap.html" class="active"><span class="icon">🗺</span>ロードマップ</a>
</div>

<script>
const STEPS = [
  {
    id: 1,
    title: 'STEP 1: スタートアップ',
    subtitle: '〜2週間 / チョコザップ入会と習慣化',
    goals: [
      { id: 'join', text: 'チョコザップに入会', type: 'manual' },
      { id: 'week1', text: '1週目に2回以上通う', type: 'manual' },
      { id: 'week2', text: '2週目に2回以上通う', type: 'manual' },
      { id: 'tried', text: 'チェスト・ラット・レッグを一通り試す', type: 'manual' }
    ],
    reward: {
      name: '🧖 サウナ1回',
      desc: '疲労回復＆代謝アップ。次のステップに向けた身体リセット'
    }
  },
  {
    id: 2,
    title: 'STEP 2: 定着期',
    subtitle: '〜1.5ヶ月 / 週3ペース確立と体重目標',
    goals: [
      { id: 'week3ok', text: '週3ペースを4週間継続', type: 'manual' },
      { id: 'chest20up', text: 'チェストプレス重量20%UP', type: 'manual' },
      { id: 'weight87', text: '体重87kg台に復帰', type: 'auto', check: s => (s.body.weight || 999) < 88 }
    ],
    reward: {
      name: '🍣 高級寿司ディナー（15,000円以内）',
      desc: '「動いたから食える」体験。事前に必要歩数計算して達成してから'
    }
  },
  {
    id: 3,
    title: 'STEP 3: 上達期',
    subtitle: '〜3ヶ月 / チョコザップ卒業レベルへ',
    goals: [
      { id: 'chestmax', text: 'チェストプレス最大重量に挑戦', type: 'manual' },
      { id: 'weight85', text: '体重85kg台', type: 'auto', check: s => (s.body.weight || 999) < 86 },
      { id: 'fat27', text: '体脂肪率27%以下', type: 'auto', check: s => (s.body.bodyFat || 999) < 27 }
    ],
    reward: {
      name: '💍 スマートリング（Oura / RingConn）',
      desc: '睡眠・活動量の高精度計測。ガジェットとしても刺さる継続支援ツール'
    }
  },
  {
    id: 4,
    title: 'STEP 4: 卒業＆エニタイム移行',
    subtitle: '〜5ヶ月 / 本格筋トレへの卒業',
    goals: [
      { id: 'anytime', text: 'エニタイムに乗り換え', type: 'manual' },
      { id: 'barbell', text: 'バーベルスクワット導入', type: 'manual' },
      { id: 'weight83', text: '体重83kg台', type: 'auto', check: s => (s.body.weight || 999) < 84 },
      { id: 'fat25', text: '体脂肪率25%以下', type: 'auto', check: s => (s.body.bodyFat || 999) < 25 }
    ],
    reward: {
      name: '🧗 クライミング体験 or ⌚ Apple Watch',
      desc: 'クライミング＝新しい運動習慣 / Apple Watch＝ワークアウト計測の決定版'
    }
  }
];

let progress = JSON.parse(localStorage.getItem('roadmapProgress') || '{}');
let state = JSON.parse(localStorage.getItem('dietState') || '{}');
state.body = state.body || {};

function saveProgress() {
  localStorage.setItem('roadmapProgress', JSON.stringify(progress));
}

function toggleGoal(stepId, goalId) {
  const key = `${stepId}_${goalId}`;
  progress[key] = !progress[key];
  saveProgress();
  render();
}

function isGoalDone(step, goal) {
  const key = `${step.id}_${goal.id}`;
  if (goal.type === 'auto') {
    return goal.check(state);
  }
  return !!progress[key];
}

function isStepCompleted(step) {
  return step.goals.every(g => isGoalDone(step, g));
}

function getStepProgress(step) {
  const done = step.goals.filter(g => isGoalDone(step, g)).length;
  return { done, total: step.goals.length, percent: Math.round(done / step.goals.length * 100) };
}

function render() {
  const container = document.getElementById('steps');
  let currentFound = false;
  const totalGoals = STEPS.reduce((s, step) => s + step.goals.length, 0);
  const doneGoals = STEPS.reduce((s, step) => s + step.goals.filter(g => isGoalDone(step, g)).length, 0);
  const overallPercent = Math.round(doneGoals / totalGoals * 100);
  document.getElementById('overallPercent').textContent = overallPercent + '%';
  document.getElementById('overallBar').style.width = overallPercent + '%';

  container.innerHTML = STEPS.map(step => {
    const completed = isStepCompleted(step);
    const prog = getStepProgress(step);
    let cls = '';
    if (completed) cls = 'completed';
    else if (!currentFound) {
      cls = 'current';
      currentFound = true;
    } else {
      cls = 'locked';
    }

    const goalsHtml = step.goals.map(g => {
      const done = isGoalDone(step, g);
      const isAuto = g.type === 'auto';
      let currentVal = '';
      if (isAuto) {
        if (g.id.includes('weight') && state.body.weight) {
          currentVal = `<div class="current-value">現在: ${state.body.weight}kg</div>`;
        }
        if (g.id.includes('fat') && state.body.bodyFat) {
          currentVal = `<div class="current-value">現在: ${state.body.bodyFat}%</div>`;
        }
      }
      const onclick = isAuto ? '' : `onclick="toggleGoal(${step.id}, '${g.id}')"`;
      return `
        <div class="goal ${done ? 'done' : ''} ${isAuto ? 'auto' : ''}" ${onclick}>
          <div class="check"></div>
          <div class="goal-text">
            ${g.text}
            ${isAuto ? '<span class="auto-tag">自動判定</span>' : ''}
            ${currentVal}
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="step ${cls}">
        <h2>${step.title}</h2>
        <div class="subtitle">${step.subtitle}</div>
        <div class="goals">${goalsHtml}</div>
        <div class="progress-bar">
          <div class="progress-bar-fill" style="width: ${prog.percent}%"></div>
        </div>
        <div style="font-size: 11px; color: #999; margin-top: 4px;">${prog.done} / ${prog.total} 達成</div>
        <div class="reward">
          <div class="reward-label">🎁 達成報酬</div>
          <div class="reward-name">${step.reward.name}</div>
          <div class="reward-desc">${step.reward.desc}</div>
        </div>
      </div>
    `;
  }).join('');
}

render();
</script>
</body>
</html>
